<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#333"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1a7f37"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#cf222e"/></marker>
</defs>
<rect width="1280" height="1060" fill="#fff"/>
<text x="640" y="30" text-anchor="middle" font-size="19" font-weight="bold">MT7601U 认证失败时序图：auth 帧卡在 EP8 OUT（PING/NAK 3 秒）</text>
<!-- lifeline heads -->
<g font-weight="bold" text-anchor="middle">
<rect x="20" y="50" width="150" height="44" rx="6" fill="#ddf4ff" stroke="#0969da"/><text x="95" y="70">wifi / init 重试</text><text x="95" y="86" font-weight="normal" font-size="11">mt7601u_connect</text>
<rect x="200" y="50" width="160" height="44" rx="6" fill="#ddf4ff" stroke="#0969da"/><text x="280" y="70">state worker</text><text x="280" y="86" font-weight="normal" font-size="11">mt7601u_service / tx_raw</text>
<rect x="400" y="50" width="160" height="44" rx="6" fill="#fff8c5" stroke="#9a6700"/><text x="480" y="70">EHCI 主控</text><text x="480" y="86" font-weight="normal" font-size="11">bulk_qh / wait_qtd</text>
<rect x="610" y="50" width="160" height="44" rx="6" fill="#fbefff" stroke="#8250df"/><text x="690" y="70">MT7601U USB 端点</text><text x="690" y="86" font-weight="normal" font-size="11">EP8 OUT · EP4/EP5 IN</text>
<rect x="830" y="50" width="200" height="44" rx="6" fill="#ffebe9" stroke="#cf222e"/><text x="930" y="70">芯片内部 TX 通路</text><text x="930" y="86" font-weight="normal" font-size="11">FCE→MCU ／ WPDMA→PBF→MAC</text>
<rect x="1090" y="50" width="160" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37"/><text x="1170" y="70">AP TP-Link_B114</text><text x="1170" y="86" font-weight="normal" font-size="11">ch9 f0:09:0d:cb:b1:14</text>
</g>
<g stroke="#999" stroke-dasharray="5,4"><line x1="95" y1="94" x2="95" y2="1040"/><line x1="280" y1="94" x2="280" y2="1040"/><line x1="480" y1="94" x2="480" y2="1040"/><line x1="690" y1="94" x2="690" y2="1040"/><line x1="930" y1="94" x2="930" y2="1040"/><line x1="1170" y1="94" x2="1170" y2="1040"/></g>

<!-- phase A -->
<rect x="10" y="108" width="1260" height="22" fill="#f6f8fa"/><text x="20" y="124" font-weight="bold">① probe 阶段：EP8 走 CPU 口（d_port=2），全部成功</text>
<line x1="280" y1="150" x2="476" y2="150" stroke="#333" marker-end="url(#a)"/><text x="290" y="145">固件分块 ×4 / MCU 命令（TXINFO d_port=CPU）</text>
<line x1="480" y1="170" x2="686" y2="170" stroke="#1a7f37" marker-end="url(#ag)"/><text x="490" y="165" fill="#1a7f37">bulk OUT EP8 14344 B ✓</text>
<line x1="690" y1="190" x2="926" y2="190" stroke="#1a7f37" marker-end="url(#ag)"/><text x="700" y="185" fill="#1a7f37">FCE → MCU（ILM、calibration）✓</text>
<line x1="930" y1="210" x2="694" y2="210" stroke="#1a7f37" marker-end="url(#ag)"/><text x="740" y="205" fill="#1a7f37">EP5 IN 回 MCU 响应 ✓</text>

<!-- phase B -->
<rect x="10" y="230" width="1260" height="22" fill="#f6f8fa"/><text x="20" y="246" font-weight="bold">② 被动扫描 ch1→ch11：只收不发（整个过程没有一个 bulk OUT）</text>
<line x1="1170" y1="275" x2="934" y2="275" stroke="#1a7f37" marker-end="url(#ag)"/><text x="990" y="270" fill="#1a7f37">beacon（空中）</text>
<line x1="930" y1="295" x2="694" y2="295" stroke="#1a7f37" marker-end="url(#ag)"/><text x="740" y="290" fill="#1a7f37">RX DMA → EP4 IN</text>
<line x1="690" y1="315" x2="484" y2="315" stroke="#1a7f37" marker-end="url(#ag)"/><text x="500" y="310" fill="#1a7f37">rx-complete 120~420 B ✓</text>
<line x1="480" y1="335" x2="284" y2="335" stroke="#1a7f37" marker-end="url(#ag)"/><text x="290" y="330" fill="#1a7f37">IRQ55 → napi_schedule → 解析 beacon</text>
<line x1="95" y1="365" x2="276" y2="365" stroke="#333" marker-end="url(#a)"/><text x="105" y="360">wifi_connect：PBKDF2 → "joining"</text>
<rect x="165" y="378" width="230" height="34" fill="#fff" stroke="#333"/><text x="280" y="392" text-anchor="middle" font-size="12">ch9 收到目标 beacon</text><text x="280" y="406" text-anchor="middle" font-size="12">写 BSSID/WCID → AUTH_PENDING</text>

<!-- phase C -->
<rect x="10" y="425" width="1260" height="22" fill="#ffebe9"/><text x="20" y="441" font-weight="bold" fill="#cf222e">③ 第一个 WLAN 帧：auth 请求（mpdu=30，总长 60 B，TXINFO d_port=WLAN(0) qsel=MGMT(0)）</text>
<line x1="280" y1="470" x2="476" y2="470" stroke="#333" marker-end="url(#a)"/><text x="290" y="465">tx_raw → bulk(EP8, 60 B)</text>
<g stroke="#cf222e" fill="#cf222e">
<line x1="480" y1="495" x2="686" y2="495" marker-end="url(#ar)"/><text x="500" y="490" stroke="none">PING</text>
<line x1="690" y1="512" x2="484" y2="512" marker-end="url(#ar)" stroke-dasharray="4,3"/><text x="600" y="507" stroke="none">NAK</text>
<line x1="480" y1="532" x2="686" y2="532" marker-end="url(#ar)"/><text x="500" y="527" stroke="none">PING</text>
<line x1="690" y1="549" x2="484" y2="549" marker-end="url(#ar)" stroke-dasharray="4,3"/><text x="600" y="544" stroke="none">NAK</text>
<text x="585" y="572" text-anchor="middle" stroke="none">⋮ 持续 3 秒，一个字节都没被收下</text>
</g>
<!-- the blocked arrow -->
<line x1="690" y1="600" x2="900" y2="600" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4"/><text x="905" y="605" fill="#cf222e" font-size="22" font-weight="bold">✗</text>
<rect x="700" y="615" width="320" height="76" rx="6" fill="#fff" stroke="#cf222e" stroke-width="2"/>
<text x="712" y="635" fill="#cf222e" font-weight="bold">问题就在这里：WLAN TX 通路不接收</text>
<text x="712" y="653" font-size="12">EP8 的 CPU 包能过，WLAN 包过不去：</text>
<text x="712" y="669" font-size="12">WPDMA TX 未使能 / MGMT 队列未开 /</text>
<text x="712" y="685" font-size="12">EP8 只路由给 MCU（换 EP9 也一样 NAK）</text>
<line x1="1170" y1="640" x2="1170" y2="640"/><text x="1060" y="725" fill="#666" font-size="12">AP 从未收到任何帧</text>
<text x="1070" y="742" fill="#666" font-size="12">（auth 根本没上空中）</text>

<rect x="340" y="590" width="330" height="62" fill="#fff8c5" stroke="#9a6700"/>
<text x="350" y="607" font-size="12">qTD token 3c8c80：Active=1，无错误位，剩 60 B</text>
<text x="350" y="623" font-size="12">QH token 3c8c81：bit0 P=1（Ping 状态）</text>
<text x="350" y="639" font-size="12">USBSTS a008：调度正常，无 halt / error</text>
<line x1="480" y1="680" x2="284" y2="680" stroke="#cf222e" marker-end="url(#ar)"/><text x="295" y="675" fill="#cf222e">wait_qtd 超时 → qh_flush → -1</text>
<rect x="160" y="690" width="240" height="34" fill="#fff" stroke="#cf222e"/><text x="280" y="704" text-anchor="middle" font-size="12" fill="#cf222e">"TX bulk failed result=-1"</text><text x="280" y="718" text-anchor="middle" font-size="12">失败分支不 drain TX_STAT_FIFO</text>

<!-- loop -->
<rect x="150" y="740" width="560" height="120" fill="none" stroke="#666" stroke-dasharray="3,3"/>
<rect x="150" y="740" width="70" height="20" fill="#666"/><text x="185" y="754" fill="#fff" text-anchor="middle" font-size="12">loop ×3</text>
<line x1="280" y1="785" x2="476" y2="785" stroke="#333" marker-end="url(#a)"/><text x="290" y="780">重发 auth（EP8, 60 B）</text>
<line x1="480" y1="805" x2="686" y2="805" stroke="#cf222e" marker-end="url(#ar)"/><text x="500" y="800" fill="#cf222e">PING/NAK… 3 s</text>
<line x1="480" y1="830" x2="284" y2="830" stroke="#cf222e" marker-end="url(#ar)"/><text x="295" y="825" fill="#cf222e">-1</text>
<rect x="200" y="875" width="160" height="34" fill="#fff" stroke="#cf222e"/><text x="280" y="890" text-anchor="middle" font-size="12" fill="#cf222e">link_retries≥3</text><text x="280" y="904" text-anchor="middle" font-size="12" fill="#cf222e">"authentication timeout"</text>
<text x="370" y="897" fill="#666" font-size="12">→ 回到 SCAN，再次发现 AP，再次卡住（循环）</text>
<line x1="276" y1="960" x2="99" y2="960" stroke="#cf222e" marker-end="url(#ar)"/><text x="110" y="955" fill="#cf222e">30 s 无握手 → -1 → "association failed"</text>
<text x="20" y="1000" font-size="12" fill="#444">对比：①里 EP8 的 CPU 包（固件、MCU 命令）全部被接收；③里同一个 EP8 上的 WLAN 包第一帧就被 NAK。所以 USB 链路、hub TT、EHCI 都正常，</text>
<text x="20" y="1018" font-size="12" fill="#444">问题在芯片里 WLAN TX DMA / 队列这一段。诊断版本：失败时转储 0x208 / 0x404 / 0x238 / 0x1004 / 0x1718，并改走 EP4 + qsel=EDCA 做对照。</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
