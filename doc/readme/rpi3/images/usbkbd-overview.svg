<text x="470.0" y="430.0" font-size="11.5" fill="#555" text-anchor="start" font-weight="normal">QEMU 不模拟 TT 的 ACK/NYET：SSPLIT 直接拿到最终结果（数据 HCINT=0x03，或 NAK 0x12）。真机才走 ACK → CSPLIT → NYET 的快路径，</text>
<text x="470.0" y="448.0" font-size="11.5" fill="#555" text-anchor="start" font-weight="normal">它在 dwc2_irq 里当场完成（dwc2_interrupt_rx_irq_fast），因为 CSPLIT 必须在 SSPLIT 之后 2 个微帧（250 µs）内发出，等 kworker 就错过了。</text>
