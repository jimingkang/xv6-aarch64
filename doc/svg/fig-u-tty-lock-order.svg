<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    .t{font-size:15px;fill:#1f2328}
    .s{font-size:13px;fill:#3d444d}
    .m{font-family:Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}
    .e{font-family:Menlo,Consolas,monospace;font-size:12px;fill:#0550ae}
    .h{font-size:17px;font-weight:700;fill:#1f2328}
    .lk{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:700;fill:#cf222e}
    .col{font-size:14px;font-weight:700;fill:#57606a}
  </style>
  <rect width="1500" height="1080" fill="#fff"/>
  <text x="750" y="32" text-anchor="middle" class="h" style="font-size:22px">tty 相关锁的嵌套顺序（箭头 A → B：持有 A 时再获取 B）</text>

  <text x="210" y="66" text-anchor="middle" class="col">外层：各对象自己的锁</text>
  <text x="690" y="66" text-anchor="middle" class="col">中间层</text>
  <text x="1115" y="66" text-anchor="middle" class="col">内层</text>

  <g transform="translate(0,40)">
  <!-- outer column -->
  <g>
    <rect x="60" y="84" width="300" height="104" rx="8" fill="#fff8f8" stroke="#cf222e" stroke-width="1.6"/>
    <text x="76" y="108" class="lk">cons.lock</text>
    <text x="76" y="130" class="s">保护 cons.buf[128] 与 r / w / e</text>
    <text x="76" y="150" class="s">取锁：consoleintr（UART 中断、USB 工作队列）</text>
    <text x="76" y="170" class="s">　　　consoleread（进程，会 sleep）</text>

    <rect x="60" y="238" width="300" height="104" rx="8" fill="#fff8f8" stroke="#cf222e" stroke-width="1.6"/>
    <text x="76" y="262" class="lk">uart_tx_lock</text>
    <text x="76" y="284" class="s">保护 uart_tx_buf[32]、tx_w、tx_r</text>
    <text x="76" y="304" class="s">以及 mu_ier 的 TX 位（读-改-写）</text>
    <text x="76" y="324" class="s">取锁：uartputc（进程）、uartintr（中断）</text>

    <rect x="60" y="392" width="300" height="104" rx="8" fill="#fff8f8" stroke="#cf222e" stroke-width="1.6"/>
    <text x="76" y="416" class="lk">pt-&gt;lock</text>
    <text x="76" y="438" class="s">每对 pty 一把：两条 512B 队列、编辑行、</text>
    <text x="76" y="458" class="s">历史、masteropen / slaveopen</text>
    <text x="76" y="478" class="s">取锁：ptyread/ptywrite/ptypoll/ptyclose</text>

    <rect x="60" y="546" width="300" height="84" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
    <text x="76" y="570" class="lk">ttyfg_lock</text>
    <text x="76" y="592" class="s">只保护一个 int：ttyfg_pgid</text>
    <text x="76" y="612" class="s">叶子锁：锁内不再拿任何锁</text>

    <rect x="60" y="660" width="300" height="84" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
    <text x="76" y="684" class="lk">kbd-&gt;lock</text>
    <text x="76" y="706" class="s">保护 active / disconnected / irq_urb</text>
    <text x="76" y="726" class="s">先放锁，再调 consoleintr → 不与 cons 嵌套</text>
  </g>

  <!-- middle column -->
  <rect x="560" y="84" width="260" height="84" rx="8" fill="#fff8f8" stroke="#cf222e" stroke-width="1.6"/>
  <text x="576" y="108" class="lk">pr.lock</text>
  <text x="576" y="130" class="s">一次 printf 的所有字符不被</text>
  <text x="576" y="150" class="s">其它 printf 打断（panic 时不用）</text>

  <rect x="560" y="410" width="260" height="84" rx="8" fill="#fff8f8" stroke="#cf222e" stroke-width="1.6"/>
  <text x="576" y="434" class="lk">ep-&gt;lock</text>
  <text x="576" y="456" class="s">epoll 就绪队列；epollwait 调</text>
  <text x="576" y="476" class="s">f_op-&gt;poll 前先放锁（无反向边）</text>

  <!-- inner column -->
  <rect x="1000" y="84" width="230" height="104" rx="8" fill="#fff1e0" stroke="#d1700b" stroke-width="2"/>
  <text x="1016" y="108" class="lk">uart_hw_lock</text>
  <text x="1016" y="130" class="s">最内层：“读 mu_lsr 有空位</text>
  <text x="1016" y="150" class="s">→ 写 mu_io” 原子化</text>
  <text x="1016" y="170" class="s">锁内只碰寄存器</text>

  <rect x="1000" y="330" width="230" height="104" rx="8" fill="#fff8f8" stroke="#cf222e" stroke-width="1.6"/>
  <text x="1016" y="354" class="lk">p-&gt;lock</text>
  <text x="1016" y="376" class="s">进程 state / chan / killed</text>
  <text x="1016" y="396" class="s">由 sleep / wakeup /</text>
  <text x="1016" y="416" class="s">signal_pgrp 获取</text>

  <!-- edges -->
  <!-- cons -> uart_hw -->
  <path d="M360,104 C520,70 860,70 996,104" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="680" y="74" text-anchor="middle" class="e">consoleintr → consputc(回显) → uartputc_sync</text>
  <!-- cons -> pr -->
  <path d="M360,140 L556,140" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="458" y="132" text-anchor="middle" class="e">^P procdump</text>
  <!-- pr -> uart_hw -->
  <path d="M820,126 L996,126" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="908" y="118" text-anchor="middle" class="e">consputc</text>
  <!-- cons -> p -->
  <path d="M360,176 C560,240 820,300 996,350" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="640" y="236" class="e">wakeup(&amp;cons.r) / sleep()</text>
  <!-- uart_tx -> uart_hw -->
  <path d="M360,262 C600,230 860,200 996,170" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="860" y="214" class="e">uartstart → uart_tx_try</text>
  <!-- uart_tx -> p -->
  <path d="M360,310 C600,320 860,350 996,370" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="560" y="350" class="e">wakeup/sleep(&amp;uart_tx_r)</text>
  <!-- pt -> p -->
  <path d="M360,410 C560,380 860,400 996,400" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="380" y="386" class="e">sleep/wakeup(&amp;q-&gt;nread/nwrite)</text>
  <!-- pt -> ep (only ptyclose) -->
  <path d="M360,460 L556,460" stroke="#cf222e" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="6 4"/>
  <text x="380" y="452" class="e" style="fill:#cf222e">仅 ptyclose</text>
  <!-- ep -> p -->
  <path d="M820,440 L996,420" stroke="#1f2328" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="840" y="454" class="e">sleep(ep)</text>
  <!-- ttyfg: after release -> signal_pgrp -> p->lock -->
  <path d="M360,588 C640,588 900,520 1060,438" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="3 4"/>
  <text x="600" y="580" class="e" style="fill:#57606a">放掉 ttyfg_lock 后才 signal_pgrp（不嵌套）</text>

  <!-- right note -->
  <rect x="1250" y="84" width="236" height="370" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1274" y="108" class="h" style="font-size:15px">结论</text>
  <text x="1274" y="134" class="s">• 图是有向无环图，</text>
  <text x="1274" y="154" class="s">　按“外→中→内”取锁，</text>
  <text x="1274" y="174" class="s">　不存在 AB-BA 死锁。</text>
  <text x="1274" y="204" class="s">• 全部是 spinlock：</text>
  <text x="1274" y="224" class="s">　acquire 先 push_off，</text>
  <text x="1274" y="244" class="s">　所以中断处理函数拿</text>
  <text x="1274" y="264" class="s">　cons.lock 不会与本核</text>
  <text x="1274" y="284" class="s">　进程自锁。</text>
  <text x="1274" y="314" class="s">• ^C 的 ttyintr 在放掉</text>
  <text x="1274" y="334" class="s">　cons.lock 之后才调，</text>
  <text x="1274" y="354" class="s">　避免 cons → ttyfg → p</text>
  <text x="1274" y="374" class="s">　三层嵌套，也缩短关中断</text>
  <text x="1274" y="394" class="s">　的时间。</text>
  <text x="1274" y="424" class="s">• 虚线红边是唯一不对称</text>
  <text x="1274" y="444" class="s">　点，见笔记问题 6。</text>

  </g>
  <!-- sleep channel table -->
  <text x="60" y="830" class="h">sleep / wakeup 通道（sleep(chan, lk) 在 p-&gt;lock 保护下放掉 lk，防止丢失唤醒）</text>
  <g transform="translate(60,846)">
    <rect x="0" y="0" width="1420" height="32" fill="#eaeef2" stroke="#d0d7de"/>
    <text x="12" y="21" class="t" style="font-weight:700">chan</text>
    <text x="250" y="21" class="t" style="font-weight:700">配对锁</text>
    <text x="440" y="21" class="t" style="font-weight:700">谁睡（条件）</text>
    <text x="900" y="21" class="t" style="font-weight:700">谁唤醒</text>

    <rect x="0" y="32" width="1420" height="32" fill="#fff" stroke="#d0d7de"/>
    <text x="12" y="53" class="m">&amp;cons.r</text><text x="250" y="53" class="m">cons.lock</text>
    <text x="440" y="53" class="s">consoleread：r == w（还没有完整一行）</text>
    <text x="900" y="53" class="s">consoleintr：收到 \n / ^D / 缓冲满，或 ^C 清空</text>

    <rect x="0" y="64" width="1420" height="32" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="12" y="85" class="m">&amp;uart_tx_r</text><text x="250" y="85" class="m">uart_tx_lock</text>
    <text x="440" y="85" class="s">uartputc：tx_w == tx_r + 32（环满）</text>
    <text x="900" y="85" class="s">uartstart：每搬走 1 字节（进程或 TX 中断里）</text>

    <rect x="0" y="96" width="1420" height="32" fill="#fff" stroke="#d0d7de"/>
    <text x="12" y="117" class="m">&amp;q-&gt;nread</text><text x="250" y="117" class="m">pt-&gt;lock</text>
    <text x="440" y="117" class="s">ptyread：队列空且对端仍打开</text>
    <text x="900" y="117" class="s">ptywrite / ptyinput 收到 \n / ptyqput 满时 / ptyclose</text>

    <rect x="0" y="128" width="1420" height="32" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="12" y="149" class="m">&amp;q-&gt;nwrite</text><text x="250" y="149" class="m">pt-&gt;lock</text>
    <text x="440" y="149" class="s">ptyqput：队列满（512）且读端仍打开</text>
    <text x="900" y="149" class="s">ptyread 读走数据后 / ptyclose</text>

    <rect x="0" y="160" width="1420" height="32" fill="#fff" stroke="#d0d7de"/>
    <text x="12" y="181" class="m">(任意 chan)</text><text x="250" y="181" class="m">p-&gt;lock</text>
    <text x="440" y="181" class="s">上面任何一个睡眠者</text>
    <text x="900" y="181" class="s">signal_pgrp / kill：置 killed 后 make_runnable，读者醒来检查 killed 返回 -1</text>
  </g>
</svg>
