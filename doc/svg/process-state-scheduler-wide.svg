<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040" role="img" aria-labelledby="title desc">
  <title id="title">xv6 进程状态转换与调度路径</title>
  <desc id="desc">RUNNABLE 位于中央，上方是创建流程，右侧是调度运行和 yield，底部是睡眠唤醒，左侧是退出回收。</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6fb7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16816f"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7654a3"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b44949"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68727d"/>
    </marker>

    <style>
      .sans { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
      .title { font-size: 31px; font-weight: 700; fill: #1f2d3d; }
      .subtitle { font-size: 17px; fill: #697582; }
      .section-title { font-size: 18px; font-weight: 700; }
      .state-title { font-size: 26px; font-weight: 700; letter-spacing: 0.7px; }
      .action-title { font-size: 18px; font-weight: 700; fill: #263747; }
      .body { font-size: 15px; fill: #465665; }
      .small { font-size: 14px; fill: #66727d; }
      .edge-label { font-size: 15px; font-weight: 700; }
      .state { filter: url(#shadow); stroke-width: 2.5; }
      .action { fill: #ffffff; stroke-width: 2; }
      .blue-line { fill: none; stroke: #2d6fb7; stroke-width: 3; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #16816f; stroke-width: 3; marker-end: url(#arrow-green); }
      .purple-line { fill: none; stroke: #7654a3; stroke-width: 3; marker-end: url(#arrow-purple); }
      .red-line { fill: none; stroke: #b44949; stroke-width: 3; marker-end: url(#arrow-red); }
      .gray-line { fill: none; stroke: #68727d; stroke-width: 2.5; marker-end: url(#arrow-gray); }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1900" height="1040" fill="#fbfcfe"/>
  <text x="950" y="44" class="sans title" text-anchor="middle">xv6 进程状态转换与调度路径</text>
  <text x="950" y="75" class="sans subtitle" text-anchor="middle">RUNNABLE 是中心汇合点：创建、唤醒和 yield 都回到这里，再由每 CPU 的 scheduler 选择运行</text>

  <!-- 分区提示 -->
  <g transform="translate(690 95)">
    <rect width="520" height="34" rx="17" fill="#fff3df"/>
    <text x="260" y="23" class="sans section-title" fill="#9a6419" text-anchor="middle">① 上方 · 创建并进入就绪队列</text>
  </g>
  <g transform="translate(1515 325)">
    <rect width="330" height="34" rx="17" fill="#e5f5f1"/>
    <text x="165" y="23" class="sans section-title" fill="#126b5e" text-anchor="middle">② 右侧 · 调度、运行与 yield</text>
  </g>
  <g transform="translate(650 980)">
    <rect width="600" height="34" rx="17" fill="#f1ecf8"/>
    <text x="300" y="23" class="sans section-title" fill="#62428b" text-anchor="middle">③ 下方 · sleep 阻塞，wakeup 重新就绪</text>
  </g>
  <g transform="translate(55 325)">
    <rect width="330" height="34" rx="17" fill="#fbe9e9"/>
    <text x="165" y="23" class="sans section-title" fill="#963b3b" text-anchor="middle">④ 左侧 · exit、等待与回收</text>
  </g>

  <!-- 顶部创建流程 -->
  <g>
    <rect x="90" y="125" width="180" height="82" rx="41" class="state" fill="#eef1f4" stroke="#7c8792"/>
    <text x="180" y="159" class="sans state-title" fill="#4d5964" text-anchor="middle">UNUSED</text>
    <text x="180" y="184" class="sans small" text-anchor="middle">空闲 proc 对象</text>

    <rect x="330" y="116" width="340" height="100" rx="14" class="action" stroke="#d29435"/>
    <text x="500" y="145" class="mono action-title" text-anchor="middle">allocproc()</text>
    <text x="500" y="172" class="sans body" text-anchor="middle">state = USED</text>
    <text x="500" y="196" class="mono small" text-anchor="middle">context.x30 = forkret / kthread_entry</text>

    <rect x="730" y="125" width="180" height="82" rx="41" class="state" fill="#fff2dd" stroke="#d29435"/>
    <text x="820" y="159" class="sans state-title" fill="#9a6419" text-anchor="middle">USED</text>
    <text x="820" y="184" class="sans small" text-anchor="middle">已分配，尚未入队</text>

    <rect x="970" y="108" width="455" height="116" rx="14" class="action" stroke="#d29435"/>
    <text x="1197" y="138" class="mono action-title" text-anchor="middle">make_runnable(p, 0)</text>
    <text x="1197" y="166" class="mono body" text-anchor="middle">rq_seq = next_rq_seq()</text>
    <text x="1197" y="192" class="mono body" text-anchor="middle">resched_hint(p)</text>
    <text x="1197" y="214" class="sans small" text-anchor="middle">通知可能需要抢占的 CPU</text>

    <path d="M270 166 H330" class="gray-line"/>
    <path d="M670 166 H730" class="gray-line"/>
    <path d="M910 166 H970" class="gray-line"/>
  </g>

  <!-- 中央 RUNNABLE -->
  <g>
    <rect x="770" y="395" width="360" height="142" rx="71" class="state" fill="#e9f2fc" stroke="#2d6fb7"/>
    <text x="950" y="447" class="sans state-title" fill="#225c99" text-anchor="middle">RUNNABLE</text>
    <text x="950" y="477" class="sans body" text-anchor="middle">已在共享可运行集合中</text>
    <text x="950" y="503" class="sans body" text-anchor="middle">等待某个 CPU 的 scheduler 选择</text>
    <text x="950" y="525" class="mono small" text-anchor="middle">state != RUNNING · 不占用 CPU</text>
  </g>

  <!-- 创建到 RUNNABLE -->
  <path d="M1197 224 V282 H1015 V391" class="blue-line"/>
  <rect x="1032" y="268" width="150" height="28" rx="14" fill="#fbfcfe"/>
  <text x="1107" y="288" class="sans edge-label" fill="#2d6fb7" text-anchor="middle">加入就绪集合</text>

  <!-- 右侧：pick_next 与 RUNNING -->
  <g>
    <rect x="1210" y="402" width="290" height="126" rx="14" class="action" stroke="#16816f"/>
    <text x="1355" y="432" class="mono action-title" text-anchor="middle">pick_next(cpu, id)</text>
    <text x="1355" y="460" class="sans body" text-anchor="middle">最高有效优先级</text>
    <text x="1355" y="486" class="mono body" text-anchor="middle">同优先级：rq_seq 最小</text>
    <text x="1355" y="512" class="mono small" text-anchor="middle">检查 cpumask 与 RUNNABLE</text>

    <rect x="1580" y="410" width="250" height="112" rx="56" class="state" fill="#e6f5f1" stroke="#16816f"/>
    <text x="1705" y="450" class="sans state-title" fill="#126b5e" text-anchor="middle">RUNNING</text>
    <text x="1705" y="480" class="sans body" text-anchor="middle">占用一个 CPU</text>
    <text x="1705" y="504" class="mono small" text-anchor="middle">c→proc = p</text>

    <path d="M1130 466 H1210" class="green-line"/>
    <path d="M1500 466 H1580" class="green-line"/>
    <text x="1540" y="448" class="mono edge-label" fill="#16816f" text-anchor="middle">swtch</text>
  </g>

  <!-- 非首次换入说明 -->
  <g>
    <rect x="1248" y="548" width="470" height="64" rx="12" fill="#f3faf8" stroke="#8cc7bc" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1483" y="574" class="sans body" text-anchor="middle">非首次换入：恢复 p→context 后</text>
    <text x="1483" y="598" class="mono body" text-anchor="middle">原先阻塞在 sched() 内的 swtch() 返回</text>
    <path d="M1705 522 V544" class="green-line dash"/>
  </g>

  <!-- yield 分支 -->
  <g>
    <rect x="1590" y="650" width="235" height="74" rx="12" class="action" stroke="#16816f"/>
    <text x="1708" y="678" class="mono action-title" text-anchor="middle">yield()</text>
    <text x="1708" y="704" class="mono body" text-anchor="middle">acquire(p→lock)</text>
    <path d="M1705 522 V650" class="green-line"/>

    <polygon points="1708,760 1818,824 1708,888 1598,824" fill="#fff7e8" stroke="#d29435" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1708" y="816" class="sans action-title" text-anchor="middle">时间片</text>
    <text x="1708" y="840" class="sans action-title" text-anchor="middle">是否用尽？</text>
    <path d="M1708 724 V756" class="gray-line"/>

    <rect x="1320" y="760" width="230" height="72" rx="12" class="action" stroke="#d29435"/>
    <text x="1435" y="788" class="sans action-title" text-anchor="middle">未用尽</text>
    <text x="1435" y="814" class="mono body" text-anchor="middle">保持原 rq_seq</text>

    <rect x="1320" y="858" width="230" height="86" rx="12" class="action" stroke="#d29435"/>
    <text x="1435" y="885" class="sans action-title" text-anchor="middle">已经用尽</text>
    <text x="1435" y="910" class="mono body" text-anchor="middle">重置 slice，更新 rq_seq</text>
    <text x="1435" y="933" class="sans small" text-anchor="middle">移到同优先级队尾</text>

    <path d="M1598 808 H1550" class="gray-line"/>
    <text x="1572" y="792" class="sans edge-label" fill="#68727d" text-anchor="middle">否</text>
    <path d="M1598 846 H1572 V901 H1550" class="gray-line"/>
    <text x="1576" y="883" class="sans edge-label" fill="#68727d" text-anchor="middle">是</text>

    <rect x="1040" y="805" width="230" height="96" rx="12" class="action" stroke="#2d6fb7"/>
    <text x="1155" y="834" class="mono action-title" text-anchor="middle">make_runnable()</text>
    <text x="1155" y="860" class="mono body" text-anchor="middle">state = RUNNABLE</text>
    <text x="1155" y="885" class="mono body" text-anchor="middle">sched()</text>
    <path d="M1320 796 H1288 V838 H1270" class="blue-line"/>
    <path d="M1320 901 H1270" class="blue-line"/>

    <path d="M1040 853 H1000 V610 H1050 V541" class="blue-line"/>
    <text x="1016" y="720" class="sans edge-label" fill="#2d6fb7" transform="rotate(-90 1016 720)" text-anchor="middle">重新进入 RUNNABLE</text>
  </g>

  <!-- 下方：sleep / wakeup -->
  <g>
    <rect x="680" y="800" width="250" height="108" rx="54" class="state" fill="#f1ecf8" stroke="#7654a3"/>
    <text x="805" y="840" class="sans state-title" fill="#62428b" text-anchor="middle">SLEEPING</text>
    <text x="805" y="870" class="mono body" text-anchor="middle">p→chan != 0</text>
    <text x="805" y="894" class="sans small" text-anchor="middle">等待指定事件</text>

    <rect x="430" y="800" width="205" height="108" rx="12" class="action" stroke="#7654a3"/>
    <text x="533" y="830" class="mono action-title" text-anchor="middle">wakeup(chan)</text>
    <text x="533" y="856" class="sans body" text-anchor="middle">匹配 p→chan</text>
    <text x="533" y="880" class="mono small" text-anchor="middle">make_runnable(p, 0)</text>
    <text x="533" y="900" class="mono small" text-anchor="middle">chan = 0，新 rq_seq</text>

    <rect x="680" y="650" width="250" height="102" rx="12" class="action" stroke="#7654a3"/>
    <text x="805" y="680" class="mono action-title" text-anchor="middle">sleep(chan, lk)</text>
    <text x="805" y="706" class="mono body" text-anchor="middle">state = SLEEPING</text>
    <text x="805" y="731" class="mono body" text-anchor="middle">p→chan = chan; sched()</text>

    <path d="M1580 484 C1480 630, 1110 640, 934 684" class="purple-line"/>
    <text x="1244" y="624" class="mono edge-label" fill="#7654a3" text-anchor="middle">sleep(chan, lk)</text>
    <path d="M805 752 V796" class="purple-line"/>
    <path d="M680 854 H635" class="purple-line"/>
    <path d="M430 854 H388 V590 H770" class="purple-line"/>
    <text x="401" y="717" class="mono edge-label" fill="#7654a3" transform="rotate(-90 401 717)" text-anchor="middle">wakeup(chan)</text>
    <path d="M770 590 V527" class="blue-line"/>
  </g>

  <!-- 左侧：exit / zombie / wait -->
  <g>
    <rect x="420" y="395" width="240" height="94" rx="12" class="action" stroke="#b44949"/>
    <text x="540" y="425" class="mono action-title" text-anchor="middle">exit()</text>
    <text x="540" y="451" class="mono body" text-anchor="middle">state = ZOMBIE</text>
    <text x="540" y="475" class="mono small" text-anchor="middle">sched() 后不再返回</text>

    <rect x="115" y="400" width="235" height="84" rx="42" class="state" fill="#fbe9e9" stroke="#b44949"/>
    <text x="233" y="434" class="sans state-title" fill="#963b3b" text-anchor="middle">ZOMBIE</text>
    <text x="233" y="461" class="sans small" text-anchor="middle">保留退出状态，等待回收</text>

    <rect x="110" y="545" width="250" height="102" rx="12" class="action" stroke="#b44949"/>
    <text x="235" y="575" class="mono action-title" text-anchor="middle">wait() / tjoin()</text>
    <text x="235" y="601" class="sans body" text-anchor="middle">释放地址空间与内核栈</text>
    <text x="235" y="625" class="mono small" text-anchor="middle">free struct proc → UNUSED</text>

    <path d="M1580 438 V300 H540 V391" class="red-line"/>
    <rect x="930" y="286" width="160" height="28" rx="14" fill="#fbfcfe"/>
    <text x="1010" y="306" class="mono edge-label" fill="#b44949" text-anchor="middle">exit()</text>
    <path d="M420 442 H354" class="red-line"/>
    <path d="M233 484 V541" class="red-line"/>
    <path d="M110 596 H55 V166 H86" class="red-line"/>
    <text x="72" y="375" class="sans edge-label" fill="#b44949" transform="rotate(-90 72 375)" text-anchor="middle">回收后重新成为空闲对象</text>
  </g>

  <!-- 页脚说明 -->
  <line x1="430" y1="952" x2="1470" y2="952" stroke="#dce2e8" stroke-width="1.5"/>
  <text x="950" y="966" class="sans small" text-anchor="middle">状态改变发生在持有 p→lock 时；sched() 只负责保存 p→context 并切回当前 CPU 的 scheduler</text>
</svg>
