<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1070" viewBox="0 0 1500 1070" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    .t{font-size:14px;fill:#1f2328}
    .s{font-size:13px;fill:#3d444d}
    .m{font-family:Menlo,Consolas,monospace;font-size:12.5px;fill:#1f2328}
    .h{font-size:18px;font-weight:700;fill:#1f2328}
    .lane{font-size:15px;font-weight:700;fill:#1f2328}
    .n{font-size:12px;font-weight:700;fill:#fff}
    .lk{fill:#ffebe9;stroke:#cf222e}
  </style>
  <rect width="1500" height="1070" fill="#fff"/>

  <!-- ================= Panel A ================= -->
  <text x="30" y="36" class="h">(a) 读一行 + ^C：cons.lock 与 p-&gt;lock 交接，保证不丢唤醒</text>
  <text x="30" y="60" class="s">时间从左到右。红底 = 持有 spinlock（同时本核关中断）。圆圈序号对应下方说明。</text>

  <!-- lanes -->
  <text x="30" y="118" class="lane">CPU1</text>
  <text x="30" y="136" class="s">sh: read(0)</text>
  <line x1="130" y1="120" x2="1470" y2="120" stroke="#d0d7de" stroke-width="2"/>
  <text x="30" y="258" class="lane">CPU0</text>
  <text x="30" y="276" class="s">UART 中断</text>
  <line x1="130" y1="260" x2="1470" y2="260" stroke="#d0d7de" stroke-width="2"/>

  <!-- CPU1 step 1: hold cons.lock -->
  <rect x="140" y="104" width="150" height="32" class="lk"/>
  <text x="215" y="125" text-anchor="middle" class="m">cons.lock</text>
  <!-- sleep handoff: p->lock overlapping -->
  <rect x="270" y="140" width="190" height="26" fill="#fff8c5" stroke="#d1700b"/>
  <text x="365" y="158" text-anchor="middle" class="m">sh-&gt;lock</text>
  <text x="300" y="188" class="s">sleep：先拿 p-&gt;lock 再放 cons.lock，</text>
  <text x="300" y="206" class="s">SLEEPING + sched 后由调度器放 p-&gt;lock</text>
  <rect x="460" y="112" width="560" height="16" fill="#eaeef2"/>
  <text x="740" y="125" text-anchor="middle" class="s">SLEEPING（chan = &amp;cons.r）</text>

  <!-- CPU0 chars -->
  <rect x="520" y="244" width="70" height="32" class="lk"/><text x="555" y="265" text-anchor="middle" class="m">'l'</text>
  <rect x="610" y="244" width="70" height="32" class="lk"/><text x="645" y="265" text-anchor="middle" class="m">'s'</text>
  <rect x="700" y="244" width="200" height="32" class="lk"/><text x="800" y="265" text-anchor="middle" class="m">'\r'→'\n' w=e</text>
  <text x="520" y="324" class="s">每个字符一次 consoleintr：拿 cons.lock，回显(uart_hw_lock)，buf[e++]=c</text>
  <rect x="860" y="280" width="140" height="22" fill="#fff8c5" stroke="#d1700b"/>
  <text x="930" y="296" text-anchor="middle" class="m">sh-&gt;lock</text>
  <path d="M930,244 L960,134" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#ab)"/>
  <text x="972" y="196" class="s" style="fill:#1f6feb">wakeup(&amp;cons.r)</text>
  <text x="972" y="214" class="s" style="fill:#1f6feb">→ RUNNABLE</text>

  <!-- CPU1 resumes -->
  <rect x="1020" y="104" width="150" height="32" class="lk"/>
  <text x="1095" y="125" text-anchor="middle" class="m">cons.lock</text>
  <text x="1180" y="118" class="s">拷出 "ls\n"，</text>
  <text x="1180" y="136" class="s">read 返回 3</text>

  <!-- ^C -->
  <rect x="1180" y="244" width="110" height="32" class="lk"/><text x="1235" y="265" text-anchor="middle" class="m">^C</text>
  <rect x="1300" y="244" width="70" height="32" fill="#f6f8fa" stroke="#57606a"/><text x="1335" y="265" text-anchor="middle" class="m">ttyfg</text>
  <rect x="1380" y="244" width="80" height="32" fill="#fff8c5" stroke="#d1700b"/><text x="1420" y="265" text-anchor="middle" class="m">p-&gt;lock×N</text>
  <text x="1180" y="300" class="s">r=w=e 清空 → 放 cons.lock</text>
  <text x="1180" y="318" class="s">→ ttyintr 读前台组 → signal_pgrp</text>
  <text x="1180" y="336" class="s">置 killed，SLEEPING 的直接唤醒</text>

  <!-- numbered notes -->
  <g transform="translate(30,370)">
    <circle cx="10" cy="10" r="10" fill="#1f2328"/><text x="10" y="14" text-anchor="middle" class="n">1</text>
    <text x="30" y="15" class="t">为什么 sleep 不会丢唤醒：CPU0 的 wakeup 必须拿 sh-&gt;lock，而 CPU1 在放 cons.lock 之前就已持有 sh-&gt;lock，直到 sched() 切走后才放。</text>
    <text x="30" y="35" class="t">所以“检查 r==w”和“变成 SLEEPING”对 consoleintr 来说是原子的（xv6 经典两把锁交接）。</text>
    <circle cx="10" cy="60" r="10" fill="#1f2328"/><text x="10" y="64" text-anchor="middle" class="n">2</text>
    <text x="30" y="65" class="t">为什么 cons.lock 必须是 spinlock：生产者 consoleintr 在中断里跑，不能睡；acquire 里的 push_off 关本核中断，防止本核进程持锁时被 UART 中断再拿同一把锁自锁。</text>
    <circle cx="10" cy="90" r="10" fill="#1f2328"/><text x="10" y="94" text-anchor="middle" class="n">3</text>
    <text x="30" y="95" class="t">USB 键盘的 usbkbd_rx_work 在工作队列（进程上下文）调 consoleintr，同样被 cons.lock 串行化，和 UART 中断可在两个核上并发。</text>
  </g>

  <line x1="20" y1="490" x2="1480" y2="490" stroke="#d0d7de"/>

  <!-- ================= Panel B ================= -->
  <text x="30" y="528" class="h" style="fill:#cf222e">(b) 潜在死锁：PTY 回显写满 output 队列时，sshd 自己等自己</text>
  <text x="30" y="552" class="s">sshd 是单线程 epoll 循环（user/sshd.c relay_shell），output 队列唯一的读者就是 sshd 自己。</text>

  <text x="30" y="618" class="lane">sh / cat</text>
  <text x="30" y="636" class="s">持 slave</text>
  <line x1="130" y1="620" x2="1470" y2="620" stroke="#d0d7de" stroke-width="2"/>
  <text x="30" y="768" class="lane">sshd</text>
  <text x="30" y="786" class="s">持 master</text>
  <line x1="130" y1="770" x2="1470" y2="770" stroke="#d0d7de" stroke-width="2"/>

  <!-- output queue meter -->
  <g transform="translate(150,670)">
    <text x="0" y="-8" class="s">pt-&gt;output（512 B）</text>
    <rect x="0" y="0" width="300" height="26" fill="#fff" stroke="#57606a"/>
    <rect x="0" y="0" width="300" height="26" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="150" y="18" text-anchor="middle" class="m">满：nwrite == nread + 512</text>
  </g>

  <!-- step1 slave write -->
  <rect x="150" y="604" width="300" height="32" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="300" y="625" text-anchor="middle" class="m">① cat 大量输出 → ptywrite(slave)</text>
  <rect x="460" y="610" width="1000" height="20" fill="#eaeef2"/>
  <text x="960" y="625" text-anchor="middle" class="s">SLEEPING（chan = &amp;output.nwrite），等 sshd 读走</text>

  <!-- step2 sshd -->
  <rect x="480" y="754" width="300" height="32" fill="#f6f8fa" stroke="#57606a"/>
  <text x="630" y="775" text-anchor="middle" class="m">② epoll：socket 先就绪</text>
  <text x="480" y="808" class="s">用户此时敲了一个键（甚至是想打断输出的 ^C），</text>
  <text x="480" y="826" class="s">或 remote_window==0 跳过了 read(master)</text>

  <rect x="800" y="754" width="330" height="32" class="lk"/>
  <text x="965" y="775" text-anchor="middle" class="m">③ writen(master,"x") 持 pt-&gt;lock</text>
  <text x="800" y="808" class="m">ptywrite → ptyinput → ptyecho</text>
  <text x="800" y="826" class="m">→ ptyqput(&amp;pt-&gt;output) 发现满</text>

  <rect x="1140" y="760" width="320" height="20" fill="#ffebe9"/>
  <text x="1300" y="775" text-anchor="middle" class="s" style="fill:#cf222e">④ sleep(&amp;output.nwrite) —— 永不醒</text>

  <path d="M1300,760 C1300,700 1300,680 1300,634" stroke="#cf222e" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="1310" y="700" class="s" style="fill:#cf222e">两边都在等 output 被读，</text>
  <text x="1310" y="718" class="s" style="fill:#cf222e">而读者正是睡着的 sshd</text>

  <g transform="translate(30,860)">
    <text x="0" y="0" class="t" style="font-weight:700">为什么会这样</text>
    <text x="0" y="24" class="t">• 回显是“同步、可阻塞”的：ptyecho 和普通 slave 输出共用 512 B 的 output 队列，ptyqput 满了就 sleep，而 master 侧写者恰好是唯一能消费 output 的人。</text>
    <text x="0" y="48" class="t">• epoll 也帮不上：ptypoll 对 master 的 EPOLLOUT 只看 input 队列是否有空位，不看回显要用的 output 队列。</text>
    <text x="0" y="72" class="t">• 只有 kill（p-&gt;killed）才能把 sshd 从 ptyqput 里拉出来；ssh 客户端那边表现为整个会话卡死。</text>
    <text x="0" y="104" class="t" style="font-weight:700">Linux 的做法</text>
    <text x="0" y="128" class="t">• n_tty 把回显放进独立的 echo_buf，由 process_echoes() 在 output_lock 下按 tty_write_room() 尽力写出，写不下就留到下次，从不阻塞输入方。</text>
    <text x="0" y="152" class="t">• pty master 的 write 只把字节塞进对端 flip buffer（只受 input 侧空间限制），回显由 flush_to_ldisc 工作队列异步完成，写者不会等回显。</text>
    <text x="0" y="176" class="t">• 修复建议：ptyecho 改为非阻塞（output 满就丢回显，或单独小环），或在 ptyqput 中对 master→echo 情况直接返回；同时让 master 的 EPOLLOUT 也考虑 output 余量。</text>
  </g>
</svg>
